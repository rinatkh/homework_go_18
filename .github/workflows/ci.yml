name: Go starter
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.12'
          cache: true
      - run: make ci
      - name: Compile unfinished acceptance contracts
        run: go test -tags=acceptance,integration -run '^$' ./...
